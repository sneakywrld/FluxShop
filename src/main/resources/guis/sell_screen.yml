# ── Sell Transaction Screen GUI ───────────────────────────────────────────────
# Shown when a player right-clicks an item to sell it.
# Mirror of buy_screen.yml but for selling.

# {item} = item display name
title: "&6&lSell {item}"

rows: 4

border:
  enabled: true
  material: GOLD_STAINED_GLASS_PANE
  name: " "

background:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

preview-slot: 13

price-display:
  slot: 11
  material: GOLD_NUGGET
  name: "&6&lPrice Info"
  lore:
    - "&7Sell price: &6{sell-price} {currency}"
    - "&7Quantity:   &fx{amount}"
    - "&7Total:      &6{total} {currency}"
    - ""
    - "&7You have: &fx{inventory-count}"

quantities:
  - slot: 18
    amount: 1
    material: WHITE_STAINED_GLASS_PANE
    name: "&fx1"

  - slot: 19
    amount: 8
    material: YELLOW_STAINED_GLASS_PANE
    name: "&ex8"

  - slot: 20
    amount: 16
    material: ORANGE_STAINED_GLASS_PANE
    name: "&6x16"

  - slot: 21
    amount: 32
    material: ORANGE_STAINED_GLASS_PANE
    name: "&6x32"

  - slot: 22
    amount: 64
    material: RED_STAINED_GLASS_PANE
    name: "&cx64"

  # Sell ALL of this item in inventory
  - slot: 23
    amount: ALL
    material: LIME_STAINED_GLASS_PANE
    name: "&aAll (&f{all}&a)"
    lore:
      - "&7Sell all of this item you carry."

  # Custom
  - slot: 24
    amount: CUSTOM
    material: WRITABLE_BOOK
    name: "&eCustom Amount"
    lore:
      - "&7Click to enter a custom amount."

confirm:
  slot: 15
  material: GOLD_BLOCK
  name: "&6&l✔ Confirm Sale"
  lore:
    - "&7Sell &fx{amount} {item}"
    - "&7for &6{total} {currency}&7."

cancel:
  slot: 17
  material: RED_CONCRETE
  name: "&c&l✘ Cancel"
  lore:
    - "&7Go back without selling."

back:
  slot: 31
  material: ARROW
  name: "&7◁ Back"
  action: BACK
