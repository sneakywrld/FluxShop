# ── Admin Analytics Dashboard GUI ────────────────────────────────────────────
# A read-only dashboard showing economy statistics.
# Accessible via /fluxshop analytics (requires fluxshop.admin.analytics)

title: "&3&l📊 Shop Analytics"

rows: 6

border:
  enabled: true
  material: BLUE_STAINED_GLASS_PANE
  name: " "

background:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

# ── Panel Slots ──────────────────────────────────────────────────────────────

# Top bought items (column 1)
top-bought:
  slot: 10
  material: DIAMOND
  name: "&b&lTop Bought Items"
  lore-header: "&7Most purchased (last {window}h):"
  lore-line: "&7  {rank}. {item} — &fx{count}"
  lore-empty: "&7  No data yet."
  max-entries: 10

# Top sold items (column 2)
top-sold:
  slot: 11
  material: GOLD_INGOT
  name: "&6&lTop Sold Items"
  lore-header: "&7Most sold (last {window}h):"
  lore-line: "&7  {rank}. {item} — &fx{count}"
  lore-empty: "&7  No data yet."
  max-entries: 10

# Total revenue
revenue:
  slot: 13
  material: SUNFLOWER
  name: "&e&lTotal Revenue"
  lore:
    - "&7Last {window}h: &6{revenue-24h} {currency}"
    - "&7Last 7d: &6{revenue-7d} {currency}"
    - "&7All time: &6{revenue-all} {currency}"

# Active buyers
active-buyers:
  slot: 15
  material: PLAYER_HEAD
  skull-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzI0ZTY3OTZlYzFhODRkZGMzM2M5MjY5ZWI4NDRmODI4NzMzZmRkOGY3YzZhYTZlNGZmZGY4YWZiZjY5In19fQ"
  name: "&a&lActive Buyers"
  lore:
    - "&7Last {window}h: &f{buyers-24h}"
    - "&7Last 7d: &f{buyers-7d}"
    - "&7Top buyer: &b{top-buyer}"

# Economy health score
health:
  slot: 22
  material: HEART_OF_THE_SEA
  name: "&c&lEconomy Health"
  lore:
    - "&7Buy/sell ratio: &f{ratio}"
    - "&7Score: {health-bar}"
    - ""
    - "&7A healthy economy has a ratio"
    - "&7close to 1.0 (buys ≈ sells)."

# Transaction volume chart (ASCII bar via lore)
volume-chart:
  slot: 20
  material: MAP
  name: "&f&lTransaction Volume"
  lore-header: "&7Hourly volume (last 12h):"
  bar-full: "&a█"
  bar-empty: "&8░"
  bar-width: 16

# Stock alerts
stock-alerts:
  slot: 24
  material: ORANGE_CONCRETE
  name: "&6&l⚠ Stock Alerts"
  lore-header: "&7Out-of-stock items:"
  lore-line: "&7  • {shop}/{item}"
  lore-empty: "&a  All items in stock!"

# Average transaction value
avg-value:
  slot: 19
  material: EMERALD
  name: "&a&lAvg Transaction"
  lore:
    - "&7Last {window}h: &6{avg-24h} {currency}"
    - "&7Last 7d: &6{avg-7d} {currency}"

# Total transactions count
tx-count:
  slot: 25
  material: BOOK
  name: "&f&lTransactions"
  lore:
    - "&7Last {window}h: &f{tx-24h}"
    - "&7Last 7d: &f{tx-7d}"
    - "&7All time: &f{tx-all}"

# Time filter toggle
time-filter:
  slot: 49
  material: CLOCK
  name: "&fTime Window"
  lore:
    - "&7Current: &f{window}h"
    - ""
    - "&7Click to cycle: 24h → 48h → 7d → 30d"
  action: CYCLE_WINDOW

# Refresh button
refresh:
  slot: 51
  material: NETHER_STAR
  name: "&bRefresh Data"
  lore:
    - "&7Reload analytics from database."
  action: REFRESH

# Export CSV button
export:
  slot: 53
  material: WRITABLE_BOOK
  name: "&eExport CSV"
  lore:
    - "&7Export analytics to a CSV file"
    - "&7in the plugin data folder."
  action: EXPORT

# Back / close button
close:
  slot: 45
  material: BARRIER
  name: "&cClose"
  action: CLOSE
