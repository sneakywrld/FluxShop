# ── Auction House GUI ─────────────────────────────────────────────────────────

# Main browse screen
browse:
  title: "&3&l⚒ Auction House"
  rows: 6

  border:
    enabled: true
    material: CYAN_STAINED_GLASS_PANE
    name: " "

  background:
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  # Listing display slots (rows 0–3 inner area)
  item-slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
    - 34

  # Listing lore template
  listing-lore:
    - ""
    - "&7Seller: &f{seller}"
    - "&7Current bid: &6{bid} {currency}"
    - "&7Buy now:  &a{buy-now} {currency}"
    - "&7Expires: &f{expires}"
    - ""
    - "&bLeft-click to bid"
    - "&aRight-click to buy now"

  navigation:
    previous-page:
      slot: 45
      material: ARROW
      name: "&b◀ Previous"
      lore: [ "&7Page {page} of {total}" ]
      action: PREV_PAGE

    page-info:
      slot: 49
      material: PAPER
      name: "&fPage &e{page}&f/&e{total}"
      lore: [ "&7{listings} active listings" ]

    next-page:
      slot: 53
      material: ARROW
      name: "&bNext ▶"
      lore: [ "&7Page {page} of {total}" ]
      action: NEXT_PAGE

    back:
      slot: 47
      material: BARRIER
      name: "&7◁ Back"
      action: BACK

    my-listings:
      slot: 46
      material: CHEST
      name: "&eMy Listings"
      lore:
        - "&7View your active listings."
        - "&7Active: &f{my-count}"
      action: MY_LISTINGS

    collect:
      slot: 48
      material: GOLD_INGOT
      name: "&6Collect"
      lore:
        - "&7Collect sold items or refunds."
        - "&7Pending: &f{pending}"
      action: COLLECT

    list-item:
      slot: 50
      material: LIME_CONCRETE
      name: "&aList Item"
      lore:
        - "&7Hold an item and click to list it."
      action: LIST_ITEM

    search:
      slot: 52
      material: COMPASS
      name: "&eSearch"
      lore:
        - "&7Filter listings by name."
      action: SEARCH

    filter:
      slot: 51
      material: HOPPER
      name: "&fFilter"
      lore:
        - "&7Sort by: &f{sort}"
        - ""
        - "&7Click to cycle sort mode."
      action: FILTER

# Bid screen
bid:
  title: "&3&lPlace a Bid"
  rows: 4

  preview-slot: 13
  info-slot: 11
  info-material: BOOK
  info-name: "&6Auction Details"
  info-lore:
    - "&7Item: &f{item}"
    - "&7Seller: &f{seller}"
    - "&7Current bid: &6{bid} {currency}"
    - "&7Buy now: &a{buy-now} {currency}"
    - "&7Expires: &f{expires}"
    - ""
    - "&7Min next bid: &6{min-bid} {currency}"
    - "&7Your balance: &a{balance} {currency}"

  bid-amounts:
    - slot: 19
      label: "Min Bid"
      amount: MIN_BID
      material: YELLOW_STAINED_GLASS_PANE
    - slot: 20
      label: "+10%"
      amount: PLUS_10_PERCENT
      material: LIME_STAINED_GLASS_PANE
    - slot: 21
      label: "+25%"
      amount: PLUS_25_PERCENT
      material: GREEN_STAINED_GLASS_PANE
    - slot: 22
      label: "Custom"
      amount: CUSTOM
      material: WRITABLE_BOOK
      name: "&eCustom Bid"
      lore: [ "&7Click to type a custom amount." ]

  confirm:
    slot: 15
    material: LIME_CONCRETE
    name: "&a&l✔ Place Bid"
    lore:
      - "&7Bid &6{bid} {currency}&7 on &f{item}"

  buy-now:
    slot: 16
    material: GOLD_BLOCK
    name: "&6&l⚡ Buy Now"
    lore:
      - "&7Instantly buy for &a{buy-now} {currency}"

  cancel:
    slot: 17
    material: RED_CONCRETE
    name: "&cCancel"
    action: BACK

# List-item screen
list:
  title: "&3&lList on Auction House"
  rows: 4

  preview-slot: 13

  start-price:
    slot: 11
    material: GOLD_INGOT
    name: "&6Starting Price"
    lore:
      - "&7Current: &6{price} {currency}"
      - "&7Click to set."
    action: SET_PRICE

  buy-now-price:
    slot: 12
    material: EMERALD
    name: "&aBuy Now Price"
    lore:
      - "&7Current: &a{buy-now} {currency}"
      - "&7Set to 0 to disable."
    action: SET_BUY_NOW

  duration:
    slot: 14
    material: CLOCK
    name: "&fDuration"
    lore:
      - "&7Current: &f{duration}h"
      - "&7Click to cycle options."
    action: CYCLE_DURATION

  confirm:
    slot: 16
    material: LIME_CONCRETE
    name: "&a&l✔ List Item"
    lore:
      - "&7List &f{item}"
      - "&7Starting at &6{price} {currency}"
      - "&7Buy now: &a{buy-now} {currency}"
      - "&7Duration: &f{duration}h"
      - ""
      - "&7Fee: &6{fee} {currency}"

  cancel:
    slot: 10
    material: RED_CONCRETE
    name: "&cCancel"
    action: BACK
