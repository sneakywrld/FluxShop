# ── SellGUI — Drag-and-Drop Sell Interface ────────────────────────────────────
# Players open this via /sellgui and drop items in to sell them instantly.
# Items with no sell value cannot be dropped in.

title: "&6&l⬇ Sell Items — Drag & Drop"

rows: 6

# The "drop zone" where players place items to sell
# All slots NOT in the reserved list below are drop zones
drop-zone-rows: [ 0, 1, 2, 3 ]  # rows 0–3 (slots 0–35)

# Reserved bottom row (row 4 & 5) for controls
border:
  enabled: true
  material: YELLOW_STAINED_GLASS_PANE
  name: " "
  # Only border rows 4–5 (the control area); rows 0–3 stay empty for items
  rows: [ 4, 5 ]

background:
  material: AIR  # drop zone is clear
  name: " "

# Live total display — updates as items are added/removed
total-display:
  slot: 49
  material: SUNFLOWER
  name: "&6&lTotal: &a{total} {currency}"
  lore:
    - "&7Drop items above to sell them."
    - "&7Remove items to take them back."
    - ""
    - "&7Items sold: &f{item-count}"
    - "&7Value: &6{total} {currency}"

# Sell All button — sells everything currently in the drop zone
sell-all:
  slot: 51
  material: LIME_CONCRETE
  name: "&a&l✔ Sell All"
  lore:
    - "&7Click to sell all items above."
    - "&7Total: &6{total} {currency}"
  action: SELL_ALL

# Return All button — returns all items to inventory
return-all:
  slot: 47
  material: RED_CONCRETE
  name: "&c&l✘ Return All"
  lore:
    - "&7Return all items to your inventory."
  action: RETURN_ALL

# Close button
close:
  slot: 45
  material: BARRIER
  name: "&cClose"
  lore:
    - "&7Items will be returned to inventory."
  action: CLOSE_RETURN

# Info panel
info:
  slot: 53
  material: BOOK
  name: "&f&lHow to use"
  lore:
    - "&71. Drag items from your inventory"
    - "&7   into the top area."
    - "&72. Check the total value."
    - "&73. Click &aSell All&7 to confirm."
    - ""
    - "&eItems with no sell value"
    - "&ewill be highlighted in red."

# Highlight items with no sell value using a red particle or name suffix
highlight-unsellable: true
unsellable-name-suffix: " &c[No value]"
