# ── Main Shop Menu GUI ────────────────────────────────────────────────────────
# First screen players see on /shop — shows all shop categories as icons.

title: "<gold><bold>✦ Server Shop ✦</bold></gold>"

# When drilling into a single shop's categories this title is used instead
# (the shop's display name is substituted dynamically in code).
category-title: "<gray>« <gold><bold>{shop}</bold></gold> <gray>»"

# Inventory size (rows × 9)
rows: 6

# Border fill — one slot deep around the entire edge
border:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

# Background fill for all remaining empty slots
background:
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

# Decoration items
decorations:

  # Solid divider across row 5 (slots 36-44)
  divider:
    slots: [ 36, 37, 38, 39, 40, 41, 42, 43, 44 ]
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  # Close button — bottom row centre
  close:
    slot: 49
    material: BARRIER
    name: "<red><bold>✕ Close"
    lore:
      - "<gray>Click to close the shop."

  # Back button — only shown in the single-shop category-picker view
  back:
    slot: 45
    material: ARROW
    name: "<gray><bold>← Back"
    lore:
      - "<gray>Return to all shops."

# ── Slot layouts ──────────────────────────────────────────────────────────────
# all-shops-slots: where the 12 shop icons are placed (3 × 4 centred grid)
# available-slots: where category icons are placed when viewing a single shop

layout:
  # 3 rows × 4 columns, centred — fits all 12 default survival shops
  all-shops-slots:
    - 11
    - 12
    - 13
    - 14
    - 20
    - 21
    - 22
    - 23
    - 29
    - 30
    - 31
    - 32

  # 4 rows × 7 columns — fits up to 28 categories per shop
  available-slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
    - 34
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43
