# ── Buy Transaction Screen GUI ────────────────────────────────────────────────
# Shown when a player left-clicks an item to buy it.
# Lets them choose a quantity before confirming the purchase.

# {item} = item display name
title: "&a&lBuy {item}"

rows: 4

border:
  enabled: true
  material: GREEN_STAINED_GLASS_PANE
  name: " "

background:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

# Item preview — shows what the player is buying (center-ish)
preview-slot: 13

# Price display item
price-display:
  slot: 11
  material: SUNFLOWER
  name: "&6&lPrice Info"
  lore:
    - "&7Buy price: &a{buy-price} {currency}"
    - "&7Quantity:   &fx{amount}"
    - "&7Total:      &6{total} {currency}"
    - ""
    - "&7Balance: &a{balance} {currency}"
    - "&7Remaining: &a{remaining} {currency}"

# Quantity buttons (fixed slots)
quantities:
  - slot: 18
    amount: 1
    material: WHITE_STAINED_GLASS_PANE
    name: "&fx1"

  - slot: 19
    amount: 8
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    name: "&bx8"

  - slot: 20
    amount: 16
    material: CYAN_STAINED_GLASS_PANE
    name: "&bx16"

  - slot: 21
    amount: 32
    material: BLUE_STAINED_GLASS_PANE
    name: "&9x32"

  - slot: 22
    amount: 64
    material: PURPLE_STAINED_GLASS_PANE
    name: "&5x64"

  # Max affordable: calculated dynamically
  - slot: 23
    amount: MAX
    material: LIME_STAINED_GLASS_PANE
    name: "&aMax (&f{max}&a)"
    lore:
      - "&7Buy as many as you can afford."

  # Custom amount: opens anvil/chat input
  - slot: 24
    amount: CUSTOM
    material: WRITABLE_BOOK
    name: "&eCustom Amount"
    lore:
      - "&7Click to enter a custom amount."

# Confirm button
confirm:
  slot: 15
  material: LIME_CONCRETE
  name: "&a&l✔ Confirm Purchase"
  lore:
    - "&7Click to buy &fx{amount} {item}"
    - "&7for &6{total} {currency}&7."

# Cancel button
cancel:
  slot: 17
  material: RED_CONCRETE
  name: "&c&l✘ Cancel"
  lore:
    - "&7Go back without buying."

# Back button
back:
  slot: 31
  material: ARROW
  name: "&7◁ Back"
  lore:
    - "&7Return to the shop."
  action: BACK

# Selected quantity glows
selection-glow: true
# The currently selected quantity's pane glows vs others are dimmed
dimmed-material: GRAY_STAINED_GLASS_PANE
