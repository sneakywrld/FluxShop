# ╔══════════════════════════════════════════════════════════════╗
# ║                  FluxShop  —  config.yml                    ║
# ║  Every setting is documented. Reload with /fluxshop reload  ║
# ╚══════════════════════════════════════════════════════════════╝

# ── General ──────────────────────────────────────────────────────────────────
general:
  # Send anonymous usage statistics to bStats (https://bstats.org)
  metrics: true
  # Check for plugin updates on startup
  update-checker: true
  # Print extra diagnostic output to console (useful for debugging)
  debug: false
  # Locale used for number / price formatting (BCP-47 tag, e.g. en-US, de-DE, fr-FR)
  locale: "en-US"
  # Format for currency display. {symbol} = currency symbol, {amount} = formatted number
  currency-format: "{symbol}{amount}"
  # Abbreviate large numbers: 1000 → 1k, 1000000 → 1M, etc.
  abbreviate-numbers: true
  # Gamemodes blocked from using the shop (CREATIVE, SPECTATOR, ADVENTURE)
  banned-gamemodes:
    - SPECTATOR
  # Worlds where the shop is disabled entirely (empty = all worlds allowed)
  disabled-worlds: []
  # If a player's inventory is full during a purchase, drop items on the ground
  drop-items-on-full-inventory: true
  # Use the item's custom display name when matching for /sellall (if true)
  use-item-display-name: false

# ── Database ──────────────────────────────────────────────────────────────────
database:
  # Storage backend: SQLITE or MYSQL
  storage-type: SQLITE

  sqlite:
    # Relative to plugin data folder
    file: "fluxshop.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "fluxshop"
    username: "root"
    password: ""
    # HikariCP connection pool settings
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    # Extra JDBC properties (optional)
    properties:
      useSSL: false
      autoReconnect: true
      characterEncoding: "utf8"

# ── Cross-Server Sharing ─────────────────────────────────────────────────────
# When multiple servers share the same MySQL database, shop stock limits and
# auction/black-market state are automatically shared — no extra configuration
# required. Simply point every server at the same MySQL instance and set
# storage-type: MYSQL above.
#
# How it works:
#  • Global stock and per-player stock are read from the DB on every purchase
#    (no in-memory cache), so purchases on Server A immediately affect what
#    Server B sees.
#  • Auction listings and Black Market rotation state are fully DB-backed.
#  • Shop YAML files (items, prices, categories) are per-server files.
#    Copy them identically to each server, or mount a shared network folder.
#
# For best performance with cross-server stock tracking, set the pool size
# high enough for concurrent reads: maximum-pool-size: 10 (default).
cross-server:
  enabled: false   # documentation-only flag; actual sharing happens via MySQL

# ── Economy ──────────────────────────────────────────────────────────────────
economy:
  # Primary economy provider.
  # AUTO = detect in priority order: Flux → Vault → CMI → Essentials → PlayerPoints → CoinsEngine
  # Or set explicitly: FLUX, VAULT, CMI, ESSENTIALS, PLAYERPOINTS, COINSENGINE
  default-provider: AUTO
  # Allow shops/items to specify their own economy provider (overrides default)
  allow-per-shop-provider: true
  allow-per-item-provider: true
  # Transaction logging
  log-to-file: true
  log-to-database: true
  log-to-discord: false    # requires DiscordSRV hook enabled below

# ── Shop Settings ─────────────────────────────────────────────────────────────
shop:
  # Default shop opened by /shop (must match a shop id in shops/ folder)
  default-shop: "main"
  # Delay (ticks) between consecutive purchases to prevent spam (0 = disabled)
  purchase-cooldown-ticks: 4
  # Enable /sellall command
  sellall-enabled: true
  # Enable /sellgui command
  sellgui-enabled: true
  # Allow players to sell renamed items
  allow-renamed-items: false
  # Allow players to sell items with custom lore
  allow-lore-items: false
  # Allow enchantments above vanilla max level (e.g. Sharpness X)
  allow-unsafe-enchants: false
  # Allow stack sizes beyond vanilla limits
  allow-illegal-stacks: false
  # When selling all, items are processed in this order: PRICE_HIGH, PRICE_LOW, NATURAL
  sellall-sort: PRICE_HIGH
  # Show a confirmation GUI before completing a transaction
  confirm-purchases: true
  confirm-sells: false
  # Physical shop stands (right-click a sign/block to open a shop)
  shop-stands-enabled: true
  # Spawner plugin to use for spawner items.
  # AUTO = detect, or: SILKSPAWNERS, ROSESTACKER, WILDSTACKER, ULTIMATESTACKER,
  #        SMARTSPAWNER, EPICSPAWNERS, MINEABLESPAWNERS, SPAWNERMETA, VANILLA
  spawner-provider: AUTO

# ── Dynamic Pricing ───────────────────────────────────────────────────────────
dynamic-pricing:
  # Enable supply/demand-based price fluctuation
  enabled: false
  # How strongly demand affects price (0.0 – 1.0)
  demand-sensitivity: 0.3
  # Maximum price multiplier (e.g. 2.0 = price can double)
  max-multiplier: 2.0
  # Minimum price multiplier (e.g. 0.5 = price can halve)
  min-multiplier: 0.5
  # How often (in minutes) prices are recalculated
  recalculate-interval-minutes: 60

# ── Discounts & Multipliers ───────────────────────────────────────────────────
discounts:
  # Enable permission-based discounts (fluxshop.discount.<group>)
  enabled: true
  # Define discount groups. Permission node: fluxshop.discount.<key>
  # Discount is a percentage OFF the buy price (0–100)
  groups:
    vip:    5
    mvp:    10
    elite:  15
    legend: 20

sell-multipliers:
  # Enable permission-based sell multipliers (fluxshop.multiplier.<group>)
  enabled: true
  # Multiplier is applied to the sell price (e.g. 1.1 = 10% more money when selling)
  groups:
    vip:    1.05
    mvp:    1.10
    elite:  1.15
    legend: 1.25

# ── Auction House ─────────────────────────────────────────────────────────────
auction:
  enabled: true
  # Fee charged to seller as a percentage of final sale price (0 = no fee)
  listing-fee-percent: 5.0
  # Flat fee charged when listing an item (0 = no flat fee)
  listing-fee-flat: 0.0
  # Default auction duration options (in hours) shown in the create GUI
  duration-options: [ 6, 12, 24, 48, 72 ]
  # Maximum concurrent listings per player (0 = unlimited)
  max-listings-per-player: 10
  # Minimum bid increment as a percentage of current bid
  bid-increment-percent: 5.0
  # Anti-snipe: extend expiry by this many seconds if bid arrives within this window
  anti-snipe-window-seconds: 30
  anti-snipe-extend-seconds: 60
  # How long expired/uncollected listings are kept in the DB (days, 0 = forever)
  expire-retention-days: 14
  # Notify outbid players
  notify-outbid: true
  # Notify seller when item sells
  notify-sold: true

# ── Player Trades ─────────────────────────────────────────────────────────────
trade:
  enabled: true
  # Time (seconds) a trade request stays active before auto-declining
  request-timeout-seconds: 60
  # Cooldown (seconds) between trade requests to the same player (0 = none)
  request-cooldown-seconds: 5
  # Allow currency exchange in trades (not just items)
  allow-currency-trade: true
  # Maximum slots per player in the trade GUI (1–9)
  max-slots-per-player: 9

# ── Black Market ─────────────────────────────────────────────────────────────
black-market:
  enabled: true
  # Cron-style schedule for rotations (uses standard 5-field cron)
  # Default: every 6 hours (at 0:00, 6:00, 12:00, 18:00)
  rotation-schedule: "0 0,6,12,18 * * *"
  # Number of items shown per rotation (randomly selected from black_market.yml pool)
  items-per-rotation: 6
  # Announce rotation to all online players
  announce-rotation: true
  # Log rotation to Discord (requires DiscordSRV hook)
  announce-to-discord: false
  # Maximum purchases per player per rotation (0 = unlimited)
  max-purchases-per-player: 1

# ── Analytics ─────────────────────────────────────────────────────────────────
analytics:
  enabled: true
  # How far back to aggregate "recent" stats (hours)
  recent-window-hours: 24
  # Interval between background aggregation queries (minutes)
  aggregation-interval-minutes: 15

# ── Sounds ────────────────────────────────────────────────────────────────────
# Sound names use Bukkit Sound enum names (https://jd.papermc.io/paper/1.21/org/bukkit/Sound.html)
# Legacy 1.8 sound names are also accepted (e.g. LEVEL_UP, CLICK).
# Set enabled: false to disable a sound entirely.
sounds:
  # Master switch for all sounds (individual sounds can still be disabled separately)
  enabled: true
  shop-open:
    enabled: true
    sound: "BLOCK_CHEST_OPEN"
    volume: 1.0
    pitch: 1.2

  purchase-success:
    enabled: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

  purchase-fail:
    enabled: true
    sound: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 1.0

  sell-success:
    enabled: true
    sound: "ENTITY_ITEM_PICKUP"
    volume: 1.0
    pitch: 1.5

  auction-bid:
    enabled: true
    sound: "BLOCK_NOTE_BLOCK_BELL"
    volume: 1.0
    pitch: 1.0

  auction-list:
    enabled: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.5

  auction-win:
    enabled: true
    sound: "UI_TOAST_CHALLENGE_COMPLETE"
    volume: 1.0
    pitch: 1.0

  trade-complete:
    enabled: true
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.0

  blackmarket-open:
    enabled: true
    sound: "BLOCK_PORTAL_AMBIENT"
    volume: 0.5
    pitch: 0.8

  gui-click:
    enabled: true
    sound: "UI_BUTTON_CLICK"
    volume: 0.6
    pitch: 1.0

  page-turn:
    enabled: true
    sound: "ITEM_BOOK_PAGE_TURN"
    volume: 0.7
    pitch: 1.0

# ── Particles ─────────────────────────────────────────────────────────────────
# Particle type names use Bukkit Particle enum.
# 'count' = number of particles; 'offset' = spread XYZ; 'speed' = data/speed value.
particles:
  # Master switch for all particles
  enabled: true
  purchase-success:
    enabled: true
    type: "VILLAGER_HAPPY"
    count: 20
    offset-x: 0.5
    offset-y: 0.5
    offset-z: 0.5
    speed: 0.1

  sell-success:
    enabled: true
    type: "SPELL_MOB"
    count: 15
    offset-x: 0.4
    offset-y: 0.4
    offset-z: 0.4
    speed: 0.0

  purchase-fail:
    enabled: true
    type: "SMOKE_NORMAL"
    count: 10
    offset-x: 0.3
    offset-y: 0.3
    offset-z: 0.3
    speed: 0.05

  blackmarket-enter:
    enabled: true
    type: "PORTAL"
    count: 30
    offset-x: 0.5
    offset-y: 1.0
    offset-z: 0.5
    speed: 0.3

  auction-win:
    enabled: true
    type: "FIREWORKS_SPARK"
    count: 50
    offset-x: 0.8
    offset-y: 1.0
    offset-z: 0.8
    speed: 0.2

  trade-complete:
    enabled: true
    type: "HEART"
    count: 8
    offset-x: 0.5
    offset-y: 0.5
    offset-z: 0.5
    speed: 0.0

# ── Discord Integration ───────────────────────────────────────────────────────
discord:
  enabled: false
  # DiscordSRV channel alias to post shop events (configure in DiscordSRV's channels.yml)
  shop-channel: "shop-log"
  auction-channel: "auction-log"
  # Log these event types (BUY, SELL, AUCTION_LIST, AUCTION_SOLD, BLACK_MARKET)
  log-events:
    - BUY
    - SELL
    - AUCTION_SOLD
    - BLACK_MARKET

# ── Bedrock / GeyserMC ────────────────────────────────────────────────────────
bedrock:
  # Automatically resize GUIs to 45 slots for Bedrock/Geyser players
  resize-gui: true
  # Disable the drag-and-drop SellGUI for Bedrock players (not supported)
  disable-sellgui: true

# ── PlaceholderAPI ────────────────────────────────────────────────────────────
placeholders:
  # Register FluxShop placeholders with PlaceholderAPI
  enabled: true

# ── RealisticSeasons ─────────────────────────────────────────────────────────
realistic-seasons:
  enabled: true
  # Seasonal price modifiers (applied on top of base price)
  # season names: SPRING, SUMMER, AUTUMN, WINTER
  # modifier: multiplier to buy AND sell price (1.0 = no change)
  modifiers:
    SPRING: 1.0
    SUMMER: 1.1
    AUTUMN: 0.95
    WINTER: 1.2
  # Broadcast a message to all players when the season changes
  announce-change: true
  change-message: "&b[FluxShop] &fThe season has changed to &e{season}&f! Shop prices have been updated."

# ── WorldGuard ───────────────────────────────────────────────────────────────
worldguard:
  # Respect WorldGuard regions: if ALLOW_SHOP flag is DENY, block shop access in that region
  enabled: true

# ── GUI Titles ────────────────────────────────────────────────────────────────
guis:
  main_menu:
    title: "&6&lShop"
  category:
    title: "&6{category}"
  buy_screen:
    title: "&aBuy &f{item}"
  sell_screen:
    title: "&6Sell &f{item}"
    sellall_title: "&6Sell All — Preview"
  sellgui:
    title: "&6SellGUI — Drop Items to Sell"
  auction_house:
    title: "&5Auction House"
    create_title: "&5List Item for Auction"
  trade:
    title: "&bTrade"
  black_market:
    title: "&0&lBlack Market"
  analytics:
    title: "&4Analytics Dashboard"

# ── Integrations ─────────────────────────────────────────────────────────────
integrations:
  discordsrv:
    # Mirror shop events to a DiscordSRV channel
    enabled: false
    # DiscordSRV channel alias (configure the channel ID in DiscordSRV's channels.yml)
    channel: "shop-log"
  citizens:
    # Register the 'fluxshop' NPC trait with Citizens
    enabled: true
  znpcs:
    # Register ZNPCsPlus shop action
    enabled: true
