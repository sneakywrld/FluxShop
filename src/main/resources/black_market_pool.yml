# ╔══════════════════════════════════════════════════════════════╗
# ║            FluxShop  —  black_market_pool.yml               ║
# ║  Define the pool of items the Black Market draws from.      ║
# ║  Each rotation randomly selects N items from this list.     ║
# ║  N is controlled by black-market.items-per-rotation in      ║
# ║  config.yml (default: 6).                                   ║
# ╚══════════════════════════════════════════════════════════════╝

# Format for each entry:
#   <key>:
#     material: MATERIAL_NAME           # Bukkit Material enum (required)
#     price: 1000.0                     # Buy price in the specified currency
#     currency: vault                   # Economy provider id (default: server default)
#     stock: 10                         # How many are available per rotation
#     max-per-player: 3                 # Per-player purchase limit per rotation (0 = unlimited)
#     display-name: "&5Mystery Item"    # Optional custom display name
#
# Items are shuffled each rotation. Add as many as you like —
# only items-per-rotation of them will appear at a time.

