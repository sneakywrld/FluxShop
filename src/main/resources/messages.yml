# ╔══════════════════════════════════════════════════════════════╗
# ║                FluxShop  —  messages.yml                    ║
# ║  Supports legacy & colour codes.                            ║
# ║  PlaceholderAPI placeholders are resolved in all messages.  ║
# ╚══════════════════════════════════════════════════════════════╝
# Available colour codes: &0-&9, &a-&f, &l, &o, &n, &m, &k, &r
# Legacy codes: &a, &b, &c ... &l, &o, &r etc.

prefix: "&8[&6&lFluxShop&8] &r"

# ── General ──────────────────────────────────────────────────────────────────
general:
  no-permission:       "&cYou don't have permission to do that."
  player-only:         "&cThis command can only be run by a player."
  player-not-found:    "&cPlayer &f{player}&c was not found."
  invalid-number:      "&c&f{input}&c is not a valid number."
  invalid-amount:      "&cAmount must be greater than zero."
  feature-disabled:    "&cThat feature is currently disabled."
  world-disabled:      "&cThe shop is not available in this world."
  gamemode-blocked:    "&cYou cannot use the shop in your current game mode."
  reload-success:      "&aFluxShop reloaded successfully in &f{ms}ms&a."
  reload-fail:         "&cAn error occurred while reloading. Check console."
  internal-error:      "&cAn internal error occurred. Please contact an administrator."

# ── Shop ─────────────────────────────────────────────────────────────────────
shop:
  shop-not-found:      "&cShop &f{shop}&c does not exist."
  section-not-found:   "&cSection &f{section}&c does not exist."
  no-access:           "&cYou don't have permission to access this shop."
  world-restricted:    "&cThis shop is not available in your current world."
  item-no-access:      "&cYou don't have permission to buy/sell this item."
  cant-buy:            "&cThis item cannot be bought."
  cant-sell:           "&cThis item cannot be sold."
  not-for-sale:        "&cThis item is not sold in any shop."
  out-of-stock:        "&cThis item is out of stock."
  stock-limit-reached: "&cYou have reached your purchase limit for this item."

# ── Transactions ─────────────────────────────────────────────────────────────
transaction:
  # {amount}, {item}, {price}, {currency} available
  buy-success:         "&aYou bought &fx{amount} {item}&a for &6{price} {currency}&a."
  sell-success:        "&aYou sold &fx{amount} {item}&a for &6{price} {currency}&a."
  buy-fail-funds:      "&cYou don't have enough &f{currency}&c. You need &6{price}&c but have &6{balance}&c."
  sell-fail-no-items:  "&cYou don't have any of that item to sell."
  sell-fail-no-value:  "&cThat item has no sell value."
  inventory-full:      "&eYour inventory is full — some items were dropped at your feet."
  cooldown:            "&cPlease wait &f{seconds}s&c before your next purchase."
  confirm-buy:         "&aClick &fConfirm&a to buy &fx{amount} {item}&a for &6{price} {currency}&a."
  confirm-sell:        "&aClick &fConfirm&a to sell &fx{amount} {item}&a for &6{price} {currency}&a."

# ── Sell All ─────────────────────────────────────────────────────────────────
sellall:
  sold:                "&aSold &f{items}&a items for a total of &6{total} {currency}&a."
  nothing-to-sell:     "&eYou have no sellable items in your inventory."
  success:             "&aSold &f{items}&a item(s) for &6{amount}&a."
  summary-header:      "&7──── Sell Summary ────"
  summary-line:        "&7  {item} x{amount} → &6{price}"
  summary-footer:      "&7──────────────────────"

# ── Auction House ─────────────────────────────────────────────────────────────
auction:
  listed:              "&aListed &f{item}&a on the Auction House for &6{price} {currency}&a."
  listed-success:      "&aItem listed on the Auction House! Expires in &f{hours}h&a."
  collect-success:     "&aYou collected your items and/or funds from the Auction House."
  collect-empty:       "&7You have nothing to collect from the Auction House."
  bid-placed:          "&aYou bid &6{bid} {currency}&a on &f{item}&a."
  seller-bid:          "&a&f{player}&a bid &6{bid} {currency}&a on your listing!"
  outbid:              "&eYou were outbid on &f{item}&e! New bid: &6{bid} {currency}&e."
  won:                 "&aYou won the auction for &f{item}&a! Cost: &6{price} {currency}&a."
  sold:                "&aYour &f{item}&a sold for &6{price} {currency}&a."
  expired-seller:      "&eYour &f{item}&e expired without a buyer and has been returned."
  expired-bidder:      "&eThe auction for &f{item}&e you were winning has expired. Your bid has been refunded."
  collected:           "&aCollected &f{item}&a from the Auction House."
  collected-currency:  "&aCollected &6{amount} {currency}&a from an Auction House sale."
  no-items-to-collect: "&eYou have nothing to collect from the Auction House."
  pending-collect:     "&eYou have uncollected items or funds from the Auction House! Use &f/auction collect&e."
  listing-limit:       "&cYou have reached your maximum listing limit (&f{max}&c)."
  bid-too-low:         "&cYour bid must be at least &6{min} {currency}&c."
  cant-bid-own:        "&cYou cannot bid on your own listing."
  listing-fee:         "&eA listing fee of &6{fee} {currency}&e has been charged."
  no-listings:         "&eThere are no active listings on the Auction House."

# ── Trade ─────────────────────────────────────────────────────────────────────
trade:
  request-sent:        "&aTrade request sent to &f{player}&a. They have &f{timeout}s&a to accept."
  request-received:    "&e&f{player}&e wants to trade with you! Type &a/trade accept&e or &c/trade decline&e."
  accepted:            "&aTrade accepted! Opening trade window..."
  declined:            "&c{player} declined your trade request."
  cancelled:           "&eTrade cancelled."
  cancelled-self:      "&eTrade cancelled."
  cancelled-other:     "&e&f{player}&e cancelled the trade."
  partner-confirmed:   "&a&f{player}&a confirmed the trade. Waiting for you..."
  failed:              "&cTrade failed: &f{reason}"
  request-expired-self:  "&eYour trade request expired."
  request-expired-other: "&eTrade request from &f{player}&e expired."
  complete:            "&aTrade completed successfully!"
  timeout:             "&eTrade request timed out."
  already-trading:     "&cYou are already in a trade."
  player-busy:         "&c{player} is already in a trade."
  cant-trade-self:     "&cYou cannot trade with yourself."
  not-ready:           "&eBoth players must confirm before the trade completes."
  cooldown:            "&cPlease wait before sending another trade request."
  no-request:          "&cYou have no pending trade request."

# ── Black Market ─────────────────────────────────────────────────────────────
black-market:
  purchased:           "&5You purchased &f{item}&5 from the Black Market for &6{price} {currency}&5."
  out-of-stock:        "&cThat Black Market item is out of stock."
  limit-reached:       "&cYou have reached your purchase limit for this rotation."
  rotation-announce:   "&5&l★ The Black Market has a new rotation! ★&r Type /blackmarket to browse."
  rotation-countdown:  "&8Next rotation in: &f{time}"
  no-permission:       "&cYou don't have access to the Black Market."

# ── Admin ─────────────────────────────────────────────────────────────────────
admin:
  price-updated:       "&aPrice updated: &f{item}&a {type} price set to &6{price}&a."
  modifier-set:        "&aPrice modifier for &f{player}&a on &f{item}&a set to &6{modifier}x&a{duration}."
  modifier-duration:   " for &f{duration}"
  restocked:           "&aRestocked &f{shop}&a{item}."
  restock-item:        " → &f{item}"
  given-item:          "&aGave &f{player}&a x{amount} &f{item}&a."
  imported:            "&aImported &f{count}&a prices from &f{source}&a."
  exported:            "&aShop config exported to &f{file}&a."
  shop-not-found:      "&cShop &f{shop}&c not found."

# ── Placeholders (used in GUI lore) ──────────────────────────────────────────
lore:
  buy-price:           "&7Buy: &a{price} {currency}"
  sell-price:          "&7Sell: &6{price} {currency}"
  no-buy:              "&7Buy: &cNot available"
  no-sell:             "&7Sell: &cNot available"
  stock-global:        "&7Stock: &f{stock}"
  stock-unlimited:     "&7Stock: &fUnlimited"
  stock-player:        "&7Your limit: &f{bought}/{max}"
  permission-required: "&cRequires: &f{permission}"
  discount-applied:    "&aDiscount: &f{discount}% OFF"
  multiplier-applied:  "&aSell bonus: &f+{bonus}%"
  dynamic-price:       "&7Dynamic pricing active"
  seasonal-modifier:   "&7Season modifier: &f{modifier}x"
  click-buy:           "&bLeft-click to buy"
  click-sell:          "&eRight-click to sell"
  click-buy-sell:      "&bLeft-click: Buy  &eRight-click: Sell"
  shift-click-max:     "&7Shift+click for max quantity"
  no-permission-item:  "&cYou don't have access to this item"


stand:
  protected:         "&cThis block is a shop stand. You need &ffluxshop.admin.stand&c permission to remove it."
  removed-on-break:  "&aShop stand record removed (block broken)."
